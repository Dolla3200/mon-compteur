<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compteur Premium Interactif</title>
    <style>
        /* Variables de couleurs pour le Mode Clair/Sombre */
        :root {
            --bg-gradient: linear-gradient(135deg, #74ebe1 0%, #d4a5ec 100%);
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-sub: #555555;
            --border-color: #eeeeee;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #cbd5e1;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            transition: background 0.3s ease;
        }

        /* Bouton Theme en haut de la carte */
        .theme-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 5px;
        }

        .card {
            position: relative;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            width: 350px;
            transition: background-color 0.3s ease, transform 0.2s;
        }
        
        h1 { color: var(--text-main); margin-top: 10px; font-size: 1.8rem; }
        p { color: var(--text-sub); }
        
        /* Styles et animation du compteur */
        .counter { 
            font-size: 5rem; 
            font-weight: bold; 
            color: #4A00E0; 
            margin: 10px 0; 
            transition: transform 0.1s ease;
            display: inline-block;
            width: 100%;
        }
        
        /* Classe d'animation temporaire au clic */
        .pop {
            transform: scale(1.2);
        }
        
        /* Message d'objectif */
        .message {
            font-weight: bold;
            color: #28a745;
            min-height: 24px;
            margin-bottom: 15px;
        }

        /* Groupes de boutons */
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }
        
        button.action-btn {
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s, opacity 0.2s;
        }
        button.action-btn:active { transform: scale(0.95); }
        button.action-btn:hover { opacity: 0.9; }

        .btn-add { background-color: #28a745; flex: 1; }
        .btn-sub { background-color: #dc3545; flex: 1; }
        .btn-reset { background-color: #6c757d; width: 100%; padding: 10px; }

        /* Section Historique */
        .history-section {
            margin-top: 25px;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            text-align: left;
        }
        .history-section h3 { margin: 0 0 10px 0; font-size: 1rem; color: var(--text-sub); }
        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 100px;
            overflow-y: auto;
            font-size: 0.85rem;
            color: var(--text-sub);
        }
        .history-list li {
            padding: 4px 0;
            border-bottom: 1px dashed var(--border-color);
        }
    </style>
</head>
<body>

    <div class="card" id="fiche">
        <!-- Bouton de changement de thème -->
        <button class="theme-toggle" id="theme-btn" title="Changer le thème">☀️</button>

        <h1>Mon Compteur Avancé</h1>
        <div class="counter" id="nombre">0</div>
        <div class="message" id="alerte-message"></div>
        
        <div class="btn-group">
            <button class="action-btn btn-sub" id="bouton-moins">Soustraire -1</button>
            <button class="action-btn btn-add" id="bouton-plus">Ajouter +1</button>
        </div>
        <button class="action-btn btn-reset" id="bouton-reset">Réinitialiser</button>

        <div class="history-section">
            <h3>Historique des actions :</h3>
            <ul class="history-list" id="liste-historique"></ul>
        </div>
    </div>

    <script>
        const nombre = document.getElementById('nombre');
        const btnPlus = document.getElementById('bouton-plus');
        const btnMoins = document.getElementById('bouton-moins');
        const btnReset = document.getElementById('bouton-reset');
        const fiche = document.getElementById('fiche');
        const alerteMessage = document.getElementById('alerte-message');
        const listeHistorique = document.getElementById('liste-historique');
        const themeBtn = document.getElementById('theme-btn');

        const OBJECTIF = 10;

        // Charger le compteur et le thème sauvegardés
        let compteur = localStorage.getItem('monCompteur') ? parseInt(localStorage.getItem('monCompteur')) : 0;
        let themeActuel = localStorage.getItem('theme') ? localStorage.getItem('theme') : 'light';
        
        // Appliquer le thème au démarrage
        document.documentElement.setAttribute('data-theme', themeActuel);
        themeBtn.textContent = themeActuel === 'dark' ? '🌙' : '☀️';

        // 🔊 Générateur de sons synthétiques (pas besoin de fichier audio externe !)
        function jouerSon(frequence, type) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            
            osc.type = type || 'sine';
            osc.frequency.value = frequence;
            
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            osc.start();
            osc.stop(ctx.currentTime + 0.1);
        }

        // ✨ Animation de rebond sur le chiffre
        function animerChiffre() {
            nombre.classList.remove('pop');
            void nombre.offsetWidth; // Astuce pour forcer le navigateur à relancer l'animation
            nombre.classList.add('pop');
            setTimeout(() => nombre.classList.remove('pop'), 100);
        }

        function ajouterHistorique(texte) {
            const li = document.createElement('li');
            const maintenant = new Date();
            const heure = maintenant.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            li.textContent = `[${heure}] ${texte}`;
            listeHistorique.insertBefore(li, listeHistorique.firstChild);
            
            if (listeHistorique.children.length > 4) {
                listeHistorique.removeChild(listeHistorique.lastChild);
            }
        }

        function rafraichirApplication(actionTexte) {
            nombre.textContent = compteur;
            localStorage.setItem('monCompteur', compteur);

            // Changement subtil de fond selon la valeur (uniquement en mode clair)
            if (document.documentElement.getAttribute('data-theme') !== 'dark') {
                if (compteur > 0) fiche.style.backgroundColor = "#eafaf1";
                else if (compteur < 0) fiche.style.backgroundColor = "#fdf2f2";
                else fiche.style.backgroundColor = "#ffffff";
            } else {
                fiche.style.backgroundColor = "var(--card-bg)";
            }

            if (compteur >= OBJECTIF) {
                alerteMessage.textContent = `🏆 Objectif de ${OBJECTIF} atteint !`;
            } else {
                alerteMessage.textContent = "";
            }

            if (actionTexte) {
                ajouterHistorique(actionTexte);
            }
        }

        // Événements boutons
        btnPlus.addEventListener('click', () => {
            compteur++;
            jouerSon(600, 'triangle'); // Son aigu agréable
            animerChiffre();
            rafraichirApplication("Ajout de +1");
        });

        btnMoins.addEventListener('click', () => {
            compteur--;
            jouerSon(300, 'triangle'); // Son plus grave
            animerChiffre();
            rafraichirApplication("Soustraction de -1");
        });

        btnReset.addEventListener('click', () => {
            compteur = 0;
            jouerSon(150, 'sawtooth'); // Son spécial reset
            animerChiffre();
            rafraichirApplication("Remise à zéro");
        });

        // Gestion du bouton Mode Sombre
        themeBtn.addEventListener('click', () => {
            let alternerTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', alternerTheme);
            localStorage.setItem('theme', alternerTheme);
            themeBtn.textContent = alternerTheme === 'dark' ? '🌙' : '☀️';
            rafraichirApplication(null);
        });

        // Premier démarrage
        rafraichirApplication("Ouverture de l'application");
    </script>
</body>
</html>
